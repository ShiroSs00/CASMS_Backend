spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/prod-migration

logging:
  level:
    root: WARN
    com.casms: INFO

jwt:
  secret: ${JWT_SECRET}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/prod-migration

  h2:
    console:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

casms:
  cors:
    allowed-origins: ${CASMS_CORS_ALLOWED_ORIGINS:}
  payment:
    guest-card-simulation-enabled: false

logging:
  level:
    root: WARN
    com.casms: INFO

jwt:
  secret: ${JWT_SECRET}

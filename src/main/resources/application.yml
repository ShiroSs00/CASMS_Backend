  spring:
    application:
      name: CASMS

    datasource:
      url: jdbc:postgresql://localhost:5432/casms?stringtype=unspecified
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:12345}
      driver-class-name: org.postgresql.Driver
      hikari:
        data-source-properties:
          stringtype: unspecified

    jpa:
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      # Keep existing development data when the application restarts.
      # Controlled deployments should apply the versioned SQL migrations and validate the schema.
      ddl-auto: update
      show-sql: false
      properties:
        hibernate:
          format_sql: true
          default_schema: public

    flyway:
      enabled: false

    jackson:
      default-property-inclusion: non_null
      serialization:
        write-dates-as-timestamps: false

  server:
    port: 8080
    servlet:
      context-path: /api

  jwt:
    secret: ${JWT_SECRET:1nxHqbJWCAIL9cnuVvhJgoUuS58qJNQBBMBebu0Rihk}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  logging:
    level:
      root: INFO
      com.casms: DEBUG
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"

  springdoc:
    api-docs:
      path: /v3/api-docs
      enabled: true
    swagger-ui:
      path: /swagger-ui.html
      enabled: true
      tags-sorter: alpha
      operations-sorter: method
      display-request-duration: true
      doc-expansion: none
      filter: true
      try-it-out-enabled: true

spring:
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: CASMS

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/casms?stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET idle_in_transaction_session_timeout = '60s';"
      data-source-properties:
        stringtype: unspecified

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # Preserve persisted assets and business data; apply versioned migrations before startup.
    ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Applied migrations are immutable: edits must fail validation. Reviewed historical edits are
    # reconciled by com.casms.config.flyway.LegacyChecksumRealigner before migrate.
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:qvmEE5tuRBQ574igb6CUIc63m4IODJRMSXTsVmoX4iD}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.casms: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none
    filter: true
    try-it-out-enabled: true

casms:
  booking:
    cancellation-workflow:
      enabled: ${CASMS_CANCELLATION_WORKFLOW_ENABLED:true}
  booking-email:
    enabled: ${CASMS_BOOKING_EMAIL_ENABLED:false}
    from: ${CASMS_BOOKING_EMAIL_FROM:taobaothanh@5zulieu.com}
    portal-url: ${CASMS_BOOKING_EMAIL_PORTAL_URL:http://localhost:5173}
  employee-activation-email:
    enabled: ${CASMS_EMPLOYEE_ACTIVATION_EMAIL_ENABLED:true}
    from: ${CASMS_EMPLOYEE_ACTIVATION_EMAIL_FROM:${SPRING_MAIL_USERNAME:taobaothanh@5zulieu.com}}
    portal-url: ${CASMS_EMPLOYEE_ACTIVATION_EMAIL_PORTAL_URL:http://localhost:5174/activate-employee-account}
    allow-loopback-http: ${CASMS_EMPLOYEE_ACTIVATION_EMAIL_ALLOW_LOOPBACK_HTTP:true}
    token-key: ${CASMS_EMPLOYEE_ACTIVATION_EMAIL_TOKEN_KEY:Q0FTTVMtRU1QTE9ZRUUtQUNUSVZBVElPTi1TRUNSRVQtS0VZLTIwMjYtMDAx}
    poll-ms: ${CASMS_EMPLOYEE_ACTIVATION_EMAIL_POLL_MS:5000}
  payment:
    sepay:
      enabled: ${SEPAY_ENABLED:true}
      api-key: ${SEPAY_API_KEY:}
      bank-name: ${SEPAY_BANK_NAME:MBBank}
      account-number: ${SEPAY_ACCOUNT_NUMBER:0901452366}
      account-name: ${SEPAY_ACCOUNT_NAME:CONG TY DU THUYEN CASMS}
      usd-to-vnd-rate: ${SEPAY_USD_TO_VND_RATE:25400}
      qr-template: ${SEPAY_QR_TEMPLATE:compact}
      tolerance-percent: ${SEPAY_TOLERANCE_PERCENT:1.0}
      card-enabled: ${SEPAY_CARD_ENABLED:true}
      default-currency: ${SEPAY_DEFAULT_CURRENCY:VND}
      supported-currencies:
        - VND
        - USD
      supported-card-brands:
        - VISA
        - MASTERCARD
      supported-payment-channels:
        - VIETQR
        - VISA
        - MASTERCARD
      merchant-id: ${SEPAY_MERCHANT_ID:CASMS-SEPAY-INTL-001}
      card-gateway-url: ${SEPAY_CARD_GATEWAY_URL:https://pay.sepay.vn/v1/card-checkout}
      three-d-secure-enabled: ${SEPAY_3DS_ENABLED:true}

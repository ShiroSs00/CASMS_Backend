services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casms-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    networks:
      - casms-network

networks:
  casms-network:
    driver: bridge
